services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: futurejobs_scale
      POSTGRES_USER: futurejobs
      POSTGRES_PASSWORD: isolated-only-password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurejobs -d futurejobs_scale"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
