version: "3.0"
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
intents:
  - greet
  - goodbye
  - run_payroll
  - create_schedule
  - generate_report
  - team_status
  - clock_in
  - clock_out
entities:
  - date_range
  - employee
  - project_name
  - day
  - start_time
  - end_time
slots:
  date_range:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: date_range
  employee:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: employee
  project_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: project_name
responses:
  utter_greet:
    - text: "Hello! I'm Lucy. How can I help you today?"
  utter_goodbye:
    - text: "Goodbye! Have a productive day."
  utter_default:
    - text: "I'm sorry, I didn't understand that command. Could you rephrase?"
actions:
  - action_run_payroll
  - action_create_schedule
  - action_generate_report
  - action_team_status
  - action_clock_in
  - action_clock_out