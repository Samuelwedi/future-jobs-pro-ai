version: "3.0"
nlu:
  - intent: greet
    examples: |
      - hey
      - hello
      - hi
      - good morning
      - good evening
      - hey there

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - see you later
      - see ya

  - intent: run_payroll
    examples: |
      - run payroll for [last week](date_range)
      - process payroll for [this month](date_range)
      - can you run payroll for [the past two weeks](date_range)
      - execute payroll for [June](date_range)

  - intent: create_schedule
    examples: |
      - create schedule for [John](employee) on [Monday](day) from [9am](start_time) to [5pm](end_time)
      - schedule [Sarah](employee) on [Tuesday](day) from [8 to 4](start_time)
      - add a shift for [Mike](employee) on [Friday](day) starting at [10am](start_time)
      - make a schedule for [next Wednesday](day) for [Anna](employee) from [7am to 3pm](start_time)

  - intent: generate_report
    examples: |
      - generate photo compliance report for project [Maple](project_name)
      - create evidence report for [Pine Plumbing](project_name)
      - make a dispute report for [Birch Electrical](project_name)
      - produce a compliance report for [Cedar Roofing](project_name)

  - intent: team_status
    examples: |
      - who is working right now
      - show my team status
      - how many employees are active
      - give me a team overview

  - intent: clock_in
    examples: |
      - clock me in for the day
      - I'm starting work now
      - begin my shift
      - clock in

  - intent: clock_out
    examples: |
      - clock me out
      - end my shift
      - I'm done for the day
      - clock out